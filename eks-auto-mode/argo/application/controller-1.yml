applications:
  guestbook:
    project: default
    name: argocd
    source:
      repoURL: https://github.com/argoproj/argocd-example-apps.git
      targetRevision: master
      path: guestbook
      directory:
        recurse: true
    destination:
      server: ${cluster_server}
      namespace: default
    syncPolicy:
      automated:
        prune: false
        selfHeal: false
      syncOptions:
        - CreateNamespace=true
